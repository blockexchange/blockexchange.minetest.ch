services:
 blockexchange:
  image: blockexchange/blockexchange
  restart: always
  # no container_name / host ports: required for "docker rollout"
  depends_on:
   - postgres
  env_file:
   - blockexchange.env
  deploy:
   replicas: 1
  healthcheck:
   # fails as soon as /tmp/draining exists (set by the pre-stop hook below)
   test: ["CMD-SHELL", "test ! -e /tmp/draining && wget -q --spider http://localhost:8080/api/healthcheck || exit 1"]
   interval: 2s
   timeout: 2s
   retries: 2
   start_period: 10s
  stop_grace_period: 20s
  networks:
   - terminator
   - default
  labels:
   - "promtail=true"
   # drain: mark unhealthy so traefik stops routing, wait for it to notice, then docker stops the container (SIGTERM + grace period)
   - "docker-rollout.pre-stop-hook=touch /tmp/draining && sleep 10"
   - "traefik.enable=true"
   - "traefik.docker.network=terminator"
   - "traefik.http.routers.blockexchange.rule=Host(`blockexchange.minetest.ch`)"
   - "traefik.http.services.blockexchange.loadbalancer.server.port=8080"
   - "traefik.http.routers.blockexchange.entrypoints=websecure"
   - "traefik.http.routers.blockexchange.tls.certresolver=default"
  logging:
   options:
    max-size: 50m

 # background jobs, not exposed through traefik
 blockexchange_worker:
  image: blockexchange/blockexchange
  restart: always
  depends_on:
   - postgres
  env_file:
   - blockexchange.env
  environment:
   - EXECUTE_JOBS=true
  labels:
   - "promtail=true"
  logging:
   options:
    max-size: 50m

 postgres:
  image: postgres:19.0
  restart: always
  shm_size: '2gb'
  environment:
   POSTGRES_PASSWORD: enter
  labels:
   - "promtail=true"
  volumes:
   - "./data/postgres:/var/lib/postgresql/data"
  command:
   - "postgres"
   - "-c"
   - "shared_buffers=4GB"
   - "-c"
   - "synchronous_commit=off"
   - "-c"
   - "max_connections=250"
  logging:
   options:
    max-size: 50m

networks:
 terminator:
  external: true
